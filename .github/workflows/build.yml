name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # lets the build publish a release with the exe attached

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Selftest (animations + tab close flow)
        run: python -m focuscat --selftest
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name FocusCat FocusCat.pyw
      - name: Selftest the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FocusCat.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe selftest failed with $($p.ExitCode)" }
      - name: Package Firefox extension
        shell: pwsh
        run: |
          # The Mozilla-signed copy (extension/signed/) is the one people can actually install.
          # Without it, ship the unsigned build under a name that says so.
          if (Test-Path extension\signed\focus-cat-link.xpi) {
            Copy-Item extension\signed\focus-cat-link.xpi dist\focus-cat-link.xpi
          } else {
            Compress-Archive -Path extension\manifest.json, extension\background.js, extension\icon.svg -DestinationPath focus-cat-link.zip
            Move-Item focus-cat-link.zip dist\focus-cat-link-UNSIGNED.xpi
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FocusCat-windows
          path: |
            dist/FocusCat.exe
            dist/*.xpi
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus Cat (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **FocusCat.exe** is the cat. Save it somewhere permanent, then double-click it.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            **focus-cat-link.xpi** is the Firefox extension (signed by Mozilla). Drag it into a Firefox window and click **Add**.
          files: |
            dist/FocusCat.exe
            dist/*.xpi
